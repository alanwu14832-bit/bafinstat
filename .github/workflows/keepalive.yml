name: 讓資料庫保持清醒

# Supabase 免費方案連續 7 天沒人讀資料就會暫停（休賽季最常發生）。這裡每 3 天讀一筆資料，讓它不會睡著。
# GitHub 會在公開 repo 60 天沒有更動後自動停用排程；所以每次執行也順手重新啟用自己和每日備份，避免休賽季失效。
# 需要的設定：GitHub repo → Settings → Secrets and variables → Actions → Variables（放在 Secrets 也可以），
#   VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY（和 Vercel 填的一樣）。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 讀一筆資料
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # (Variables 或 Secrets 都可以)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::沒有讀資料：GitHub → Settings → Secrets and variables → Actions 要有 VITE_SUPABASE_URL 和 VITE_SUPABASE_ANON_KEY"; exit 0; fi
          # 舊版 anon key（eyJ 開頭）也放進 Authorization；新版 publishable key 只放 apikey
          AUTH=(); case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY");; esac
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL/rest/v1/games?select=id&limit=1" -H "apikey: $KEY" "${AUTH[@]}")
          echo "HTTP $code"
          test "$code" = "200"

      - name: 重新啟用排程（避免 60 天沒更動被停用）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml backup.yml; do
            curl -sS -o /dev/null -w "$wf HTTP %{http_code}\n" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
